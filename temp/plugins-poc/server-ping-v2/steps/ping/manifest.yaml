---
apiVersion: syntara.io/v1alpha1
kind: Action
metadata:
  name: ping
  displayName: Ping server
  description: Sends a real HTTP request to check whether a server is up.
spec:
  runtime:
    kind: custom-workload
    implementation: steps/ping/implementation.py
  input:
    kind: asset
    path: schemas/ping.input.yaml
  output:
    kind: inline
    value:
      type: object
      description: Reachability report from the real ping.
      additionalProperties: false
      required: [reachable]
      properties:
        reachable:
          type: boolean
          description: Whether the server responded.
        status_code:
          type: integer
          description: HTTP status code returned.
        response_time_ms:
          type: integer
          description: Round-trip time in milliseconds.
        error:
          type: string
          description: Error message when the ping fails.
